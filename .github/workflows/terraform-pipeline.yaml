name: Terraform

# =============================================================================
# SINGLE PIPELINE - same logic as the ADO orchestrator + resource pipelines.
#
#   ORCHESTRATOR part : detect-changes  (which backends changed)
#                       per-backend matrix = the ADO "dispatch"
#   RESOURCE part     : plan  (per backend, PR)   fmt -> validate -> init -> plan -> artifact
#                       apply (per backend, main) download saved plan -> init -> apply
#
#   pull_request -> detect, plan per backend, approval, terraform-gate
#   push to main -> apply the SAME saved plan files that were reviewed on the PR
#
# No `paths:` filter on purpose: `terraform-gate` must always report so it can be
# a required check. Backend detection happens inside the workflow instead.
# =============================================================================
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tf-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'apply-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel an apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # ===========================================================================
  # ORCHESTRATOR - Stage 1: detect changed backends
  #   changed .tf/.tfvars files under the scope path -> walk up to the nearest
  #   folder with backend.tf -> one matrix entry per backend
  # ===========================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          SCOPE_PATH: ${{ vars.TF_SCOPE_PATH || 'workspace' }}   # = detect_changes_in_path in ADO
        run: |
          set -euo pipefail
          SCOPE_PATH="${SCOPE_PATH%/}"

          if [ "$EVENT" = "pull_request" ]; then
            BASE=$(git merge-base HEAD "origin/${BASE_REF}")
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="${SHA}^"; fi
            BASE="$BEFORE"
          fi
          echo "Scope: ${SCOPE_PATH}/   Diff base: $BASE"

          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD -- "${SCOPE_PATH}/" \
            | grep -E '\.(tf|tfvars|tfvars\.json)$' || true)
          echo "Changed Terraform files:"; echo "${CHANGED_FILES:-  (none)}"

          dirs=$(
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              d=$(dirname "$f")
              found=false
              while [ "$d" != "." ] && [ "$d" != "/" ]; do
                if [ -f "$d/backend.tf" ]; then echo "$d"; found=true; break; fi
                d=$(dirname "$d")
              done
              if [ "$found" = false ]; then echo "::warning::No backend.tf found walking up from $f" >&2; fi
            done <<<"$CHANGED_FILES" | sort -u
          )

          json='[]'
          for d in $dirs; do
            json=$(jq -c --arg d "$d" '. + [{dir:$d, name:($d|gsub("/";"-"))}]' <<<"$json")
          done
          echo "Backends queued: $json"
          {
            echo "matrix=$json"
            echo "has_changes=$([ "$json" != '[]' ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # RESOURCE - Stage "plan" (PR), one parallel job per backend (= ADO dispatch).
  # An error fails ONLY that backend's job (fail-fast: false).
  # ===========================================================================
  plan:
    name: plan (${{ matrix.dir }})
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write          # WIF / OIDC
      pull-requests: write     # PR comment
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        working-directory: .
        env:
          DIR: ${{ matrix.dir }}
        run: |
          [ -d "$DIR" ] || { echo "::error::Directory not found: $DIR"; exit 1; }
          [ -f "$DIR/backend.tf" ] || { echo "::error::No backend.tf in $DIR"; exit 1; }
          echo "Backend: $DIR"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.12.2' }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      - name: Authenticate via Workload Identity Federation (plan SA)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}

      # -lockfile=readonly: apply must use the exact provider versions this plan used.
      # Commit .terraform.lock.hcl for every backend.
      - name: terraform init
        run: terraform init -input=false -reconfigure -lockfile=readonly

      - name: terraform plan
        id: plan
        env:
          DIR: ${{ matrix.dir }}
        run: |
          set -o pipefail
          terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan 2>&1 | tee plan-output.txt
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

          echo "Plan summary:"
          grep -E "^Plan:|will be created|will be destroyed|will be updated|must be replaced|No changes" plan.txt || true
          DESTROY_COUNT=$(grep -cE "will be destroyed|must be replaced" plan.txt || true)
          if [ "$DESTROY_COUNT" -gt 0 ]; then
            echo "::warning::$DESTROY_COUNT resource(s) in $DIR will be DESTROYED or REPLACED."
          fi

      - name: PR comment and run summary
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          TF_DIR: ${{ matrix.dir }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { TF_DIR: dir, PLAN_OUTCOME } = process.env;
            const marker = `<!-- tf-plan:${dir} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = PLAN_OUTCOME === 'success';
            const file = fs.existsSync(`${dir}/plan.txt`) ? `${dir}/plan.txt` : `${dir}/plan-output.txt`;
            const full = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(no plan output; an earlier step failed)';
            const plan = full.length > 60000 ? full.slice(0, 60000) + '\n... truncated, see run summary ...' : full;
            const body = `${marker}\n### Terraform plan: \`${dir}\` ${ok ? '✅' : '❌'}\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n</details>\n\n[Workflow run](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            await core.summary.addHeading(`Terraform plan: ${dir}`, 3).addCodeBlock(full.slice(0, 900000), 'terraform').write();

      # Publish plan artifact: this saved plan is exactly what apply executes after merge.
      - name: Publish plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/tfplan
            ${{ matrix.dir }}/plan.json
            ${{ matrix.dir }}/plan.txt
          if-no-files-found: error
          retention-days: 14

  # Standard approval. Reviewers read the plan in the PR comment / run summary.
  approval:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: tf-plan-approval
    steps:
      - run: echo "Plan approved."

  # ===========================================================================
  # PR: single REQUIRED status check. Fails if any backend's plan or the
  # approval failed. Skipped jobs (no Terraform changes) = OK.
  # ===========================================================================
  terraform-gate:
    name: terraform-gate
    if: always() && github.event_name == 'pull_request'
    needs: [detect-changes, plan, approval]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          if jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' <<<"$RESULTS" > /dev/null; then
            echo "::error::One or more backends failed plan/approval. See the plan (<dir>) jobs."
            exit 1
          fi

  # ===========================================================================
  # PUSH to main: locate the approved PR run so we can reuse its saved plans
  # ===========================================================================
  find-plan-run:
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      pr: ${{ steps.find.outputs.pr }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - id: find
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || { echo "::error::No PR is associated with $SHA (direct push to main?). Nothing approved to apply."; exit 1; }
          head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          # latest SUCCESSFUL PR run for that head commit = every plan and the approval passed
          run_id=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success&per_page=100" \
            | jq -r --arg n "$WORKFLOW_NAME" '[.workflow_runs[] | select(.name==$n)] | sort_by(.created_at) | last | .id // empty')
          [ -n "$run_id" ] || { echo "::error::No successful PR run found for PR #$pr head $head. Re-run the PR workflow."; exit 1; }
          echo "PR #$pr, plan run $run_id"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # RESOURCE - Stage "apply" (push to main), one backend at a time.
  # Applies the saved, approved plan from the PR run (never a new plan).
  # ===========================================================================
  apply:
    name: apply (${{ matrix.dir }})
    needs: [detect-changes, find-plan-run]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tf-apply
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      actions: read            # download artifacts from the PR run
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Safety: what is on main for this backend must be identical to what was planned on the PR.
      - name: Verify merged code equals planned code
        working-directory: .
        env:
          PR: ${{ needs.find-plan-run.outputs.pr }}
          DIR: ${{ matrix.dir }}
          SHARED: ${{ vars.TF_SHARED_PATHS }}     # optional, e.g. "modules"
        run: |
          git fetch origin "refs/pull/${PR}/head"
          # shellcheck disable=SC2086
          if ! git diff --quiet FETCH_HEAD HEAD -- "$DIR" $SHARED; then
            echo "::error::Code on main differs from the reviewed PR head for $DIR (branch was not up to date at merge). Open a new PR so it is re-planned and re-approved."
            exit 1
          fi

      - name: Download plan artifact (from the approved PR run)
        uses: actions/download-artifact@v4
        with:
          name: plan-${{ matrix.name }}
          path: ${{ matrix.dir }}
          run-id: ${{ needs.find-plan-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.12.2' }}
          terraform_wrapper: false

      - name: Authenticate via Workload Identity Federation (apply SA)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}

      - name: terraform init
        run: terraform init -input=false -reconfigure -lockfile=readonly

      # Applies exactly the saved plan. Terraform refuses it if state changed since planning.
      - name: terraform apply (saved plan)
        run: |
          terraform apply -input=false -lock-timeout=5m -no-color tfplan
          rm -f tfplan
