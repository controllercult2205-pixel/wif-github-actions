# =====================================================================
# Terraform ORCHESTRATOR - decides WHAT runs, never runs terraform itself
#  - PR   : detect changed stacks -> call the resource pipeline (mode: plan)
#  - main : detect changed stacks -> find the PR's plan run -> call the
#           resource pipeline (mode: apply) with that run id, so the
#           SAVED plan is applied (no re-plan)
# All terraform commands run in .github/workflows/terraform-resource.yaml
# =====================================================================
name: terraform-orchestrator

on:
  pull_request:
    branches: [main]
    paths: ["workspace/**"]
  push:
    branches: [main]
    paths: ["workspace/**"]

permissions:
  contents: read
  id-token: write # WIF token for google-github-actions/auth
  actions: read # find the PR plan run and download its artifacts
  pull-requests: read # find the PR behind a push to main

# one run per branch at a time; never cancel a running apply on main
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # -------------------------------------------------------------------
  # 1. Which stacks changed?
  # -------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "pull_request" ]]; then
            changed=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          else
            # new branch push has no "before" commit -> compare with parent
            [[ "$PUSH_BEFORE" =~ ^0+$ ]] && PUSH_BEFORE="$PUSH_AFTER~1"
            changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")
          fi

          # stack = folder under workspace/ that contains .tf files
          stacks=$(
            while read -r f; do
              [[ "$f" == workspace/* ]] || continue
              d=$(dirname "$f")
              compgen -G "$d/*.tf" >/dev/null && echo "$d"
            done <<<"$changed" | sort -u
          )

          json=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"$stacks")
          echo "Stacks: $json"
          echo "stacks=$json" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # 2. PR: hand each changed stack to the resource pipeline (mode: plan)
  # -------------------------------------------------------------------
  stack-plan:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.stacks != '[]'
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    uses: ./.github/workflows/terraform-resource.yaml
    with:
      stack_path: ${{ matrix.stack }}
      mode: plan

  # -------------------------------------------------------------------
  # 3. main: find the successful PR run that holds the saved plans
  # -------------------------------------------------------------------
  find-plan:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # PR that produced this commit on main
          pr_head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            | jq -r '[.[] | select(.merged_at != null)][0].head.sha // empty')
          if [[ -z "$pr_head" ]]; then
            echo "::error::$SHA was not merged through a PR, so there is no saved plan to apply. Merge changes via a PR."
            exit 1
          fi

          # latest successful run of THIS workflow for the PR's last commit
          wf_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" | jq -r '.workflow_id')
          plan_run=$(gh api "repos/$REPO/actions/workflows/$wf_id/runs?event=pull_request&head_sha=$pr_head&per_page=20" \
            | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          if [[ -z "$plan_run" ]]; then
            echo "::error::No successful PR plan run found for commit $pr_head. Re-run the PR checks before merging."
            exit 1
          fi

          echo "Applying saved plans from run $plan_run (PR head $pr_head)"
          echo "run_id=$plan_run" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # 4. main: hand each changed stack to the resource pipeline
  #    (mode: apply) - the terraform apply itself runs there
  # -------------------------------------------------------------------
  stack-apply:
    needs: [detect, find-plan]
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    uses: ./.github/workflows/terraform-resource.yaml
    with:
      stack_path: ${{ matrix.stack }}
      mode: apply
      plan_run_id: ${{ needs.find-plan.outputs.run_id }}
