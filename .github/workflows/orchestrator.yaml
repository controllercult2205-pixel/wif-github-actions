# =====================================================================
# Terraform ORCHESTRATOR
#  - detects which stack folders under workspace/ changed
#  - PR      : plan each changed stack (read-only SA)
#  - main    : plan + apply each changed stack (write SA)
# Each stack is run by the reusable RESOURCE pipeline
# (.github/workflows/terraform-resource.yml).
# =====================================================================
name: terraform-orchestrator

on:
  pull_request:
    branches: [main]
    paths: ["workspace/**"]
  push:
    branches: [main]
    paths: ["workspace/**"]

permissions:
  contents: read
  id-token: write # WIF token for google-github-actions/auth

# one run per branch at a time; never cancel a running apply on main
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # -------------------------------------------------------------------
  # 1. Which stacks changed?
  # -------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "pull_request" ]]; then
            mode=plan
            changed=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          else
            mode=apply
            # new branch push has no "before" commit -> compare with parent
            [[ "$PUSH_BEFORE" =~ ^0+$ ]] && PUSH_BEFORE="$PUSH_AFTER~1"
            changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")
          fi

          # stack = folder under workspace/ that contains .tf files
          stacks=$(
            while read -r f; do
              [[ "$f" == workspace/* ]] || continue
              d=$(dirname "$f")
              compgen -G "$d/*.tf" >/dev/null && echo "$d"
            done <<<"$changed" | sort -u
          )

          json=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"$stacks")
          echo "Mode:   $mode"
          echo "Stacks: $json"
          echo "stacks=$json" >> "$GITHUB_OUTPUT"
          echo "mode=$mode"   >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # 2. Plan (PR) - read-only SA
  # -------------------------------------------------------------------
  plan:
    needs: detect
    if: needs.detect.outputs.stacks != '[]' && needs.detect.outputs.mode == 'plan'
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    uses: ./.github/workflows/terraform-resource.yml
    with:
      stack_path: ${{ matrix.stack }}
      mode: plan

  # -------------------------------------------------------------------
  # 3. Apply (push to main) - each changed stack plans (read SA) then
  #    applies that saved plan (write SA)
  # -------------------------------------------------------------------
  apply:
    needs: detect
    if: needs.detect.outputs.stacks != '[]' && needs.detect.outputs.mode == 'apply'
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    uses: ./.github/workflows/resource-pipeline.yaml
    with:
      stack_path: ${{ matrix.stack }}
      mode: apply
