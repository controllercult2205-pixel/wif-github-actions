# =====================================================================
# Terraform RESOURCE pipeline (reusable) - ONE stack
#   mode = plan  : terraform-plan SA (read)  -> fmt, init, validate, plan,
#                  save tfplan + has_changes as artifact
#   mode = apply : terraform-apply SA (write) -> download the saved plan
#                  from the PR run and apply it (no new plan)
# =====================================================================
name: terraform-resource

on:
  workflow_call:
    inputs:
      stack_path:
        description: "Stack folder, e.g. workspace/dev"
        type: string
        required: true
      mode:
        description: "plan | apply"
        type: string
        required: true
      plan_run_id:
        description: "apply only: workflow run id that holds the saved plan"
        type: string
        default: ""
      terraform_version:
        type: string
        default: "1.12.2"
      workload_identity_provider:
        type: string
        default: "projects/288387971293/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
      plan_service_account:
        type: string
        default: "terraform-plan@project-e711dfa4-6d59-4e27-9cd.iam.gserviceaccount.com"
      apply_service_account:
        type: string
        default: "terraform-apply@project-e711dfa4-6d59-4e27-9cd.iam.gserviceaccount.com"
      apply_environment:
        description: "GitHub environment for apply (add required reviewers for a manual approval)"
        type: string
        default: "gcp-apply"

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  # -------------------------------------------------------------------
  # PLAN - read-only SA, saves the plan for the later apply
  # -------------------------------------------------------------------
  plan:
    name: plan (${{ inputs.stack_path }})
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.stack_path }}
    steps:
      - uses: actions/checkout@v4

      - id: id
        working-directory: .
        run: echo "artifact=tfplan-$(echo '${{ inputs.stack_path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.plan_service_account }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - id: plan
        name: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan
          rc=$?
          set -e
          if   [[ $rc -eq 0 ]]; then echo false > has_changes
          elif [[ $rc -eq 2 ]]; then echo true  > has_changes
          else exit $rc; fi
          echo "has_changes=$(cat has_changes)" >> "$GITHUB_OUTPUT"

      - name: summary
        run: |
          {
            echo "### Terraform plan: \`${{ inputs.stack_path }}\` (changes: ${{ steps.plan.outputs.has_changes }})"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # saved plan + flag, picked up by the apply on main
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.id.outputs.artifact }}
          path: |
            ${{ inputs.stack_path }}/tfplan
            ${{ inputs.stack_path }}/has_changes
          retention-days: 30

  # -------------------------------------------------------------------
  # APPLY - write SA, applies the SAVED plan from the PR run
  # -------------------------------------------------------------------
  apply:
    name: apply (${{ inputs.stack_path }})
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.apply_environment }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.stack_path }}
    steps:
      - uses: actions/checkout@v4

      - id: id
        working-directory: .
        run: echo "artifact=tfplan-$(echo '${{ inputs.stack_path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: download saved plan (from PR run ${{ inputs.plan_run_id }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.id.outputs.artifact }}
          path: ${{ inputs.stack_path }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - id: check
        name: changes in saved plan?
        run: |
          echo "has_changes=$(cat has_changes)" >> "$GITHUB_OUTPUT"
          echo "Saved plan has changes: $(cat has_changes)"

      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.has_changes == 'true'
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.apply_service_account }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.has_changes == 'true'
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: init
        if: steps.check.outputs.has_changes == 'true'
        run: terraform init -input=false

      - name: apply saved plan
        if: steps.check.outputs.has_changes == 'true'
        run: terraform apply -input=false -no-color tfplan
