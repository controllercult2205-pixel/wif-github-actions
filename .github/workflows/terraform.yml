name: 'Terraform Landing Zone'

on:
  pull_request:
    branches: [ "main" ]
    paths: [ 'workspace/**' ]
  push:
    branches: [ "main" ]
    paths: [ 'workspace/**' ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-landing-zone-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_WORKLOAD_ID: projects/987730182969/locations/global/workloadIdentityPools/github-action-landing/providers/github-oidc-provider
  GCP_SA: sa-workload-lz@lz-test-14279.iam.gserviceaccount.com

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Dynamic Matrix
        id: set-matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CHANGED_DIRS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^workspace/.*\.(tf|tfvars)$' \
            | xargs -r -n1 dirname | sort -u \
            | while read -r d; do [ -d "$d" ] && echo "$d"; done || true)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No Terraform changes detected."
            echo "dirs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON_ARRAY=$(echo "$CHANGED_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  scan-and-plan:
    name: Scan & Plan (${{ matrix.dir }})
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Directory Slug
        env:
          DIR: ${{ matrix.dir }}
        run: echo "DIR_SLUG=$(echo "$DIR" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ env.GCP_WORKLOAD_ID }}
          service_account: ${{ env.GCP_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Stand-in for Wiz during testing. Swap back to the Wiz step later.
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dir }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Terraform Init & Plan
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -input=false -var-file="variables.tfvars"
          terraform show -json tfplan > "$RUNNER_TEMP/tfplan.json"

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: OPA approval tier
        env:
          DIR: ${{ matrix.dir }}
        run: |
          opa eval -f json -i "$RUNNER_TEMP/tfplan.json" -d policy/approval.rego "data.approval" > decision.json

          REQ=$(jq -r 'if .result[0].expressions[0].value.additional_approval_required == false then "false" else "true" end' decision.json)
          REASONS=$(jq -c '.result[0].expressions[0].value.reasons // []' decision.json)

          jq -n --arg dir "$DIR" --argjson additional "$REQ" --argjson reasons "$REASONS" \
            '{dir:$dir, additional:$additional, reasons:$reasons}' > "decision-${DIR_SLUG}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: decision-${{ env.DIR_SLUG }}
          path: decision-${{ env.DIR_SLUG }}.json
          retention-days: 3

      - name: Upload Plan Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.DIR_SLUG }}
          path: ${{ matrix.dir }}/tfplan
          retention-days: 3

  decide:
    name: Approval Decision
    needs: scan-and-plan
    runs-on: ubuntu-latest
    outputs:
      additional_approval: ${{ steps.agg.outputs.additional_approval }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: decision-*
          merge-multiple: true
          path: decisions

      - name: Aggregate
        id: agg
        run: |
          ANY=$(jq -s 'if length == 0 then true else any(.[]; .additional != false) end' decisions/*.json)
          echo "additional_approval=$ANY" >> "$GITHUB_OUTPUT"

          {
            echo "### Standard approval: always required"
            echo "### Additional approval: $ANY"
            jq -r -s '.[] | select(.reasons | length > 0) | "**" + .dir + "**", (.reasons[] | "- " + .)' decisions/*.json
          } >> "$GITHUB_STEP_SUMMARY"

  gate-standard:
    name: Standard Approval
    needs: decide
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: landing-zone-approval
    steps:
      - run: echo "Standard approval granted"

  gate-high-risk:
    name: Additional Approval (High Risk)
    needs: [decide, gate-standard]
    if: github.event_name == 'push' && needs.decide.outputs.additional_approval == 'true'
    runs-on: ubuntu-latest
    environment: landing-zone-high-risk-approval
    steps:
      - run: echo "Additional approval granted"

  apply:
    name: Apply (${{ matrix.dir }})
    needs: [detect-changes, scan-and-plan, decide, gate-standard, gate-high-risk]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.scan-and-plan.result == 'success' &&
      needs.decide.result == 'success' &&
      needs.gate-standard.result == 'success' &&
      (needs.gate-high-risk.result == 'success' || needs.gate-high-risk.result == 'skipped')
    runs-on: ubuntu-latest
    environment: landing-zone-production
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Directory Slug
        env:
          DIR: ${{ matrix.dir }}
        run: echo "DIR_SLUG=$(echo "$DIR" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ env.GCP_WORKLOAD_ID }}
          service_account: ${{ env.GCP_SA }}

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.DIR_SLUG }}
          path: ${{ matrix.dir }}

      - name: Terraform Init & Apply
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -input=false
          terraform apply -input=false tfplan
